# The Collector of highbar's OpenTelemetry guide (site/guides/opentelemetry.md on develop).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  batch:
    timeout: 100ms
exporters:
  file:
    path: /var/otel/traces.jsonl
    flush_interval: 100ms
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
